services:
  api:
    # 默认使用自研开源截图服务（./de-screenshot，首次启动时自动构建），接口与 dataease.playwright-server 一致
    build: ./de-screenshot
    image: ${DE_PLAYWRIGHT_IMAGE:-dataease/de-screenshot:1.0.0}
    container_name: de-playwright-api
    privileged: true
    environment:
      - CONCURRENCY=${DE_PLAYWRIGHT_CONCURRENCY}
      - TZ=Asia/Shanghai
    volumes:
      - ${DE_BASE}/dataease3.0/logs:/opt/app/logs
    restart: unless-stopped
    init: true
    ipc: host
    shm_size: ${DE_PLAYWRIGHT_SHM_SIZE}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dataease-network3
